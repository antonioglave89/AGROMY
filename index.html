<header><h1>Agro<b>MY</b><span id="rb"></span></h1><button class="btn sec" id="sw" data-sw="1" style="display:none">Esci</button></header>

<main id="app"><div class="hero"><h2>Accedi ad AgroMY</h2><p class="empty">1. Scegli il tuo profilo</p><div class="chips" style="justify-content:center"><button class="chip" data-role="f">Agricoltore</button><button class="chip" data-role="a">Agronomo</button></div><p class="empty">2. Inserisci le tue credenziali</p><div class="card" style="text-align:left"><div class="grid" style="grid-template-columns:1fr"><label>Email<input id="lg_e" type="email" value="" autocomplete="username"></label><label>Password<input id="lg_p" type="password" autocomplete="current-password"></label><p class="neg" id="lg_err" role="alert" style="margin:0"></p><button class="btn" id="lg_in">Accedi</button><button class="btn sec" id="lg_up">Crea account</button></div><p class="note">Gli account sono salvati solo su questo dispositivo: per usarli da più dispositivi serve un servizio online.</p></div></div></main>
<script>
(function(){
var KEY="agromy-v1",Y0=new Date().getFullYear(),TT=["Seminativo","Frutteto","Oliveto","Vigneto"],TC={Seminativo:"#8a6414",Frutteto:"#a8442b",Oliveto:"#4f6f2a",Vigneto:"#6d3f7c"},TR=["Diserbo","Concimazione","Aratura","Trattamento fitosanitario","Irrigazione","Altro"],REG=["Convenzionale","Biologico","SQNPI"];
var S={role:"",me:{nome:"",email:""},users:[],sel:"",lge:"",list:[],cur:"",ag:"",v:"az",av:"par",cy:Y0,nuova:false};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);for(var k in p)S[k]=p[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function eur(n){return(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0});}
function num(n,d){return(n||0).toLocaleString("it-IT",{maximumFractionDigits:d==null?2:d});}
function f(id){return document.getElementById(id).value;}
function today(){return new Date().toISOString().slice(0,10);}
function sum(a,k){return a.reduce(function(s,r){return s+(+r[k]||0)},0);}
function fuel(x){return(+x.lt||0)*(+x.pl||0);}
function cls(n){return n>=0?"pos":"neg";}
function field(l,id,type,extra){return'<label>'+l+'<input id="'+id+'" type="'+(type||"text")+'" '+(extra||"")+'></label>';}
function opts(a,sel){return a.map(function(t){return'<option'+(t===sel?" selected":"")+'>'+esc(t)+'</option>';}).join("");}
function tb(hd,rows){if(!rows.length)return"";var h='<div class="tw"><table><tr>'+hd.map(function(x){return'<th>'+x+'</th>'}).join("")+'</tr>';rows.forEach(function(r){h+='<tr>'+r.map(function(c){return'<td>'+(c&&c.h!=null?c.h:esc(c))+'</td>'}).join("")+'</tr>';});return h+'</table></div>';}
function gm(p){return{h:p.loc?'<a href="https://www.google.com/maps/search/?api=1&amp;query='+encodeURIComponent(p.loc)+'" target="_blank" rel="noopener">Apri</a>':"–"};}
function X(k,id){return{h:'<button class="x" data-del="'+k+':'+id+'" aria-label="Elimina">✕</button>'};}
function myAz(){return S.list.filter(function(a){return a.owner===S.me.email})}
function A(){return myAz().filter(function(a){return a.id===S.cur})[0];}
function AG(){return S.list.filter(function(a){return a.id===S.ag})[0];}
function tgt(a,t){var x=t.split(":");if(x[0]==="g"){var g=a.gru.filter(function(r){return r.id===x[1]})[0];if(!g)return null;return{nome:g.nome,tipo:g.tipo,ha:sum(a.par.filter(function(p){return g.pids.indexOf(p.id)>-1}),"ha")};}
var p=a.par.filter(function(r){return r.id===x[1]})[0];return p?{nome:p.nome,tipo:p.tipo,ha:+p.ha||0}:null;}
function tn(a,t){var T=tgt(a,t);return T?T.nome:"(particella rimossa)";}
function th(a,t){var T=tgt(a,t);return T?num(T.ha):"–";}
function allT(a){return a.par.map(function(p){return"p:"+p.id}).concat(a.gru.map(function(g){return"g:"+g.id}));}
function yrs(a){return a.camps.slice().sort(function(x,y){return y-x});}
function cn(a,y,t){return a.col.filter(function(x){return x.y===y&&x.t===t}).map(function(x){return x.tipo}).join(", ")||"–";}
function tot(a,y){var c=0,m=0,r=0;a.tr.forEach(function(x){if(x.y===y){c+=(+x.costo||0)+fuel(x);m+=(+x.ore||0)*(+x.cor||0);}});a.col.forEach(function(x){if(x.y===y)r+=(+x.qta||0)*(+x.prezzo||0);});return{c:c,m:m,r:r,mg:r-c-m};}
function kpi(t){return'<div class="kpi"><div><small>Costi (prodotti, carburante, manodopera)</small><b>'+eur(t.c+t.m)+'</b></div><div><small>Ricavi</small><b>'+eur(t.r)+'</b></div><div><small>Margine</small><b class="'+cls(t.mg)+'">'+eur(t.mg)+'</b></div></div>';}

/* ---------- AGRICOLTORE ---------- */
function toolbar(a){var h='<div class="bar0"><label>Azienda<select id="sel_az">'+myAz().map(function(x){return'<option value="'+x.id+'"'+(x.id===S.cur&&!S.nuova?" selected":"")+'>'+esc(x.nome)+'</option>'}).join("")+'<option value="new"'+(S.nuova?" selected":"")+'>+ Nuova azienda</option></select></label>';
if(a)h+='<label>Campagna<select id="sel_y">'+yrs(a).map(function(y){return'<option value="'+y+'"'+(y===S.cy?" selected":"")+'>Campagna '+y+'</option>'}).join("")+'</select></label>';return h+'</div>';}
function vAzForm(a){var n=!a,A0=a||{};return'<div class="card"><h2>'+(n?'Crea la tua azienda':'Dati dell’azienda')+'</h2><div class="grid">'+field("Nome dell’azienda","a_n","text",'value="'+esc(A0.nome)+'"')+field("Nome del proprietario","a_t","text",'value="'+esc(A0.tn)+'"')+field("Cognome","a_c","text",'value="'+esc(A0.cg)+'"')+field("Indirizzo dell’azienda","a_i","text",'value="'+esc(A0.ind)+'"')+'<label>Regime<select id="a_r">'+opts(REG,A0.reg)+'</select></label>'+'<button class="btn" id="az_save">'+(n?'Crea azienda':'Salva dati')+'</button></div>'+(n&&!myAz().length?'<p class="note">Vuoi solo provare? <button class="chip" id="demo">Carica un’azienda di esempio</button></p>':'')+'</div>';}
function vAz(){var a=A();if(!a||S.nuova)return toolbar(a)+vAzForm(null);
var h=toolbar(a)+vAzForm(a)+'<h2>Operai</h2><div class="card"><div class="grid">'+field("Nome","o_n")+field("Cognome","o_c")+'<button class="btn" id="o_add">Aggiungi operaio</button></div>'+tb(["Nome","Cognome",""],a.ope.map(function(o){return[o.nome,o.cg,X("ope",o.id)]}))+'</div><h2>Particelle</h2><div class="card"><div class="grid">'+field("Nome","p_n","text",'placeholder="es. Campo Nord"')+field("Comune","p_m")+field("Foglio","p_f")+field("Mappale","p_p")+field("Posizione (indirizzo o lat, lng)","p_l","text",'placeholder="es. 43.318, 11.331"')+field("Ettari","p_h","number",'step="0.01" min="0"')+'<label>Tipologia<select id="p_t">'+opts(TT)+'</select></label><button class="btn" id="p_add">Aggiungi</button></div><p class="note">Gli ettari si inseriscono a mano. L’import automatico dalle visure catastali richiede un collegamento a un servizio esterno, non incluso in questa versione.</p></div>';
if(a.par.length){h+='<div class="card">'+tb(["Particella","Catasto","Ettari","Tipologia","Mappa",""],a.par.map(function(p){return[p.nome+(p.by?" (aggiunta dall’agronomo)":""),[p.mun,p.fg&&"F."+p.fg,p.mp&&"m."+p.mp].filter(Boolean).join(" "),num(p.ha),{h:'<select data-ch="par:'+p.id+'">'+opts(TT,p.tipo)+'</select>'},gm(p),X("par",p.id)]}))+'<p class="note">Totale: '+num(sum(a.par,"ha"))+' ha. Per aggiornare l’azienda elimina una particella venduta o aggiungine una acquistata: lo storico delle campagne resta.</p></div>';
h+='<h2>Mappa dell’azienda</h2><div class="card"><div class="map">'+a.par.map(function(p){return'<div style="flex:'+Math.max(+p.ha||0,.3)+' 1 100px;background:'+TC[p.tipo]+'"><b>'+(p.loc?"📍 ":"")+esc(p.nome)+'</b><small>'+num(p.ha)+' ha, '+p.tipo+'</small></div>'}).join("")+'</div><p class="note">Vista schematica: ogni riquadro è proporzionale agli ettari. Le particelle con una posizione hanno il segnaposto 📍 e il link “Apri” nella tabella le mostra su Google Maps. La mappa Google con tutti i segnaposti insieme richiede una chiave Google Maps e un hosting dedicato.</p></div>';}
h+='<h2>Gruppi di particelle</h2><div class="card"><div class="grid">'+field("Nome del gruppo","g_n","text",'placeholder="es. Oliveti"')+'<label>Tipologia<select id="g_t">'+opts(TT)+'</select></label><button class="btn" id="g_add">Crea gruppo</button></div></div>';
a.gru.forEach(function(g){var T=tgt(a,"g:"+g.id);h+='<div class="card"><div class="top"><h3 style="margin:0">'+esc(g.nome)+' <span class="tag" style="background:'+TC[g.tipo]+'">'+g.tipo+'</span></h3><span><select data-ch="gru:'+g.id+'" style="width:auto">'+opts(TT,g.tipo)+'</select><button class="x" data-del="gru:'+g.id+'" aria-label="Elimina gruppo">✕</button></span></div><div class="chips">'+a.par.map(function(p){return'<button class="chip'+(g.pids.indexOf(p.id)>-1?" on":"")+'" data-tg="'+g.id+':'+p.id+'">'+esc(p.nome)+'</button>'}).join("")+'</div><b>Totale: '+num(T.ha)+' ha</b></div>';});
return h;}

function vCamp(){var a=A();if(!a)return vAz();var y=S.cy,h=toolbar(a)+'<h2>Campagna '+y+'</h2><div class="card"><div class="grid">'+field("Nuova campagna (anno)","y_n","number",'min="2000" max="2100" value="'+(Math.max.apply(null,a.camps)+1)+'"')+'<button class="btn sec" id="y_add">Crea campagna</button></div></div><datalist id="cl"><option>Grano<option>Girasole<option>Mais<option>Orzo<option>Soia<option>Olive<option>Uva</datalist>';
if(!a.par.length&&!a.gru.length)return h+'<p class="empty">Aggiungi prima le particelle nel livello Azienda.</p>';
allT(a).forEach(function(t){var T=tgt(a,t),cs=a.col.filter(function(r){return r.y===y&&r.t===t}),ts=a.tr.filter(function(r){return r.y===y&&r.t===t}).sort(function(p,q){return p.data<q.data?-1:1});
h+='<details class="card"><summary><b>'+esc(T.nome)+'</b> <span class="tag" style="background:'+TC[T.tipo]+'">'+T.tipo+'</span> '+num(T.ha)+' ha · '+cs.length+' colture · '+ts.length+' trattamenti</summary><h3>Colture</h3><div class="grid">'+field("Tipologia di coltura","col-"+t+"-n","text",'list="cl" placeholder="es. Grano"')+field("Quantità (q.li)","col-"+t+"-q","number",'step="0.1" min="0"')+'<button class="btn" data-add="col:'+t+'">Aggiungi coltura</button></div>'+tb(["Coltura","Quantità (q.li)",""],cs.map(function(r){return[r.tipo,num(r.qta,1),X("col",r.id)]}))
+'<h3>Trattamenti</h3><div class="grid">'+field("Data","tr-"+t+"-d","date",'value="'+today()+'"')+'<label>Tipologia<select id="tr-'+t+'-t">'+opts(TR)+'</select></label>'+field("Prodotto","tr-"+t+"-p")+field("Quantità","tr-"+t+"-q","number",'step="0.01" min="0"')+'<label>Unità<select id="tr-'+t+'-u">'+opts(["kg","l","q.li","t"])+'</select></label>'+field("Costo prodotto (€)","tr-"+t+"-k","number",'step="0.01" min="0"')+'<label>Operaio<select id="tr-'+t+'-w">'+(a.ope.length?opts(a.ope.map(function(o){return o.nome+" "+o.cg})):'<option value="">(nessun operaio)</option>')+'</select></label>'+field("Ore lavorate","tr-"+t+"-o","number",'step="0.25" min="0"')+field("Costo orario (€/ora)","tr-"+t+"-c","number",'step="0.5" min="0" value="12"')+field("Litri carburante","tr-"+t+"-l","number",'step="0.1" min="0"')+field("Prezzo nafta (€/litro)","tr-"+t+"-f","number",'step="0.01" min="0"')+field("Avversità (fitosanitari)","tr-"+t+"-a")+'<button class="btn" data-add="tr:'+t+'">Aggiungi trattamento</button></div>'+tb(["Data","Tipologia","Prodotto","Quantità","Costo prodotto","Operaio","Ore","€/ora","Carburante",""],ts.map(function(r){return[r.data,r.tipo,r.prod,num(r.qta)+" "+r.um,eur(r.costo),r.op||"–",num(r.ore),eur(r.cor),num(r.lt)+" l, "+eur(fuel(r)),X("tr",r.id)]}))+'</details>';});
return h;}

function vRic(){var a=A();if(!a)return vAz();var y=S.cy,cs=a.col.filter(function(r){return r.y===y}),h=toolbar(a)+'<h2>Ricavi della campagna '+y+'</h2>';
if(!cs.length)return h+'<p class="empty">Nessuna coltura in questa campagna. Inseriscile nel livello Campagna.</p>';
h+='<div class="card tw"><table><tr><th>Destinazione</th><th>Coltura</th><th>Quintali</th><th>Prezzo €/q.le</th><th>Data raccolta</th><th class="n">Totale</th></tr>';
cs.forEach(function(r){h+='<tr><td>'+esc(tn(a,r.t))+'</td><td>'+esc(r.tipo)+'</td><td><input type="number" step="0.1" min="0" value="'+(r.qta||"")+'" data-rc="'+r.id+':qta" style="width:100px"></td><td><input type="number" step="0.01" min="0" value="'+(r.prezzo||"")+'" data-rc="'+r.id+':prezzo" style="width:100px"></td><td><input type="date" value="'+(r.dr||"")+'" data-rc="'+r.id+':dr"></td><td class="n"><b>'+eur((+r.qta||0)*(+r.prezzo||0))+'</b></td></tr>';});
return h+'<tr><th colspan="5">Totale ricavi</th><th class="n">'+eur(tot(a,y).r)+'</th></tr></table></div><p class="note">Il totale è quintali × prezzo al quintale.</p>';}

function vRec(){var a=A();if(!a)return vAz();var y=S.cy,h=toolbar(a)+'<h2>Recap azienda: campagna '+y+'</h2>'+kpi(tot(a,y)),ys=yrs(a),mx=1;
ys.forEach(function(k){var t=tot(a,k);mx=Math.max(mx,t.c+t.m,t.r);});
h+='<h3>Storico delle campagne</h3><div class="card">'+ys.map(function(k){var t=tot(a,k);return'<div class="hb"><span>'+k+'</span><i style="width:'+Math.max(1,(t.c+t.m)/mx*35)+'%;background:var(--rd)"></i>'+eur(t.c+t.m)+'</div><div class="hb"><span></span><i style="width:'+Math.max(1,t.r/mx*35)+'%;background:var(--pr)"></i>'+eur(t.r)+'</div>'}).join("")+'<p class="note">Rosso: costi. Verde: ricavi.</p></div><div class="card">'+tb(["Campagna","Prodotti e carburante","Manodopera","Ricavi","Margine"],ys.map(function(k){var t=tot(a,k);return[String(k),eur(t.c),eur(t.m),eur(t.r),{h:'<b class="'+cls(t.mg)+'">'+eur(t.mg)+'</b>'}]}))+'</div>';
var rows=allT(a).concat(a.col.concat(a.tr).filter(function(r){return r.y===y&&!tgt(a,r.t)}).map(function(r){return r.t}).filter(function(v,i,s){return s.indexOf(v)===i})).map(function(t){var c=0,m=0,r=0;a.tr.forEach(function(x){if(x.y===y&&x.t===t){c+=(+x.costo||0)+fuel(x);m+=(+x.ore||0)*(+x.cor||0)}});a.col.forEach(function(x){if(x.y===y&&x.t===t)r+=(+x.qta||0)*(+x.prezzo||0)});return[tn(a,t),cn(a,y,t),eur(c+m),eur(r),{h:'<b class="'+cls(r-c-m)+'">'+eur(r-c-m)+'</b>'}]}).filter(function(r){return r[2]!==eur(0)||r[3]!==eur(0)});

/* ---------- AGRONOMO ---------- */

var AVT=[["par","Particelle e colture"],["reg","Registro trattamenti"],["fer","Fertilizzanti"],["rac","Raccolta"],["bio","Biologico e SQNPI"]];
function vAD(){var a=AG();if(!a){S.ag="";return vAL();}if(a.camps.indexOf(S.cy)<0)S.cy=yrs(a)[0];var y=S.cy,v=S.av,h='<button class="btn sec" data-back="1">← Tutte le aziende</button><h2 style="margin-top:12px">'+esc(a.nome)+'</h2><p class="note" style="margin:-6px 0 12px">'+esc(a.tn+" "+a.cg)+', '+esc(a.ind)+'</p><div class="bar0"><label>Campagna<select id="sel_ay">'+yrs(a).map(function(k){return'<option value="'+k+'"'+(k===y?" selected":"")+'>Campagna '+k+'</option>'}).join("")+'</select></label></div><div class="chips">'+AVT.map(function(t){return'<button class="chip'+(v===t[0]?" on":"")+'" data-av="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div>';
var E='<p class="empty">Nessun dato registrato.</p>';
function trs(fn){return a.tr.filter(function(r){return fn(r)&&r.y===y}).sort(function(p,q){return p.data<q.data?-1:1});}
if(v==="par"){h+='<div class="card"><h3 style="margin-top:0">Aggiungi una particella</h3><div class="grid">'+field("Nome","q_n")+field("Comune","q_m")+field("Foglio","q_f")+field("Mappale","q_p")+field("Posizione (indirizzo o lat, lng)","q_l")+field("Ettari","q_h","number",'step="0.01" min="0"')+'<label>Tipologia<select id="q_t">'+opts(TT)+'</select></label><button class="btn" id="q_add">Aggiungi</button></div><p class="note">L’agronomo può aggiungere particelle ma non eliminarle: la rimozione spetta all’agricoltore.</p></div><div class="card">'+tb(["Particella","Catasto","Ettari","Tipologia"],a.par.map(function(p){return[p.nome+(p.by?" (aggiunta dall’agronomo)":""),[p.mun,p.fg&&"F."+p.fg,p.mp&&"m."+p.mp].filter(Boolean).join(" "),num(p.ha),p.tipo]}))+'</div>';
yrs(a).forEach(function(k){var cs=a.col.filter(function(r){return r.y===k});h+='<h3>Campagna '+k+'</h3><div class="card">'+(cs.length?tb(["Destinazione","Ettari","Coltura","Quantità (q.li)"],cs.map(function(r){return[tn(a,r.t),th(a,r.t),r.tipo,num(r.qta,1)]})):E)+'</div>';});}
else if(v==="reg"){var r1=trs(function(r){return r.tipo==="Trattamento fitosanitario"});h+='<h3>Registro dei trattamenti fitosanitari, campagna '+y+'</h3><div class="card">'+(r1.length?tb(["Data","Destinazione","Ettari","Coltura","Prodotto","Quantità","Avversità"],r1.map(function(r){return[r.data,tn(a,r.t),th(a,r.t),cn(a,y,r.t),r.prod,num(r.qta)+" "+r.um,r.avv||"–"]})):E)+'</div>';}
else if(v==="fer"){var r2=trs(function(r){return r.tipo==="Concimazione"});h+='<h3>Fertilizzanti utilizzati, campagna '+y+'</h3><div class="card">'+(r2.length?tb(["Data","Destinazione","Ettari","Coltura","Prodotto","Quantità"],r2.map(function(r){return[r.data,tn(a,r.t),th(a,r.t),cn(a,y,r.t),r.prod,num(r.qta)+" "+r.um]})):E)+'</div>';}
else if(v==="rac"){var cs2=a.col.filter(function(r){return r.y===y});h+='<h3>Date di raccolta, campagna '+y+'</h3><div class="card">'+(cs2.length?tb(["Destinazione","Ettari","Coltura","Quantità (q.li)","Data di raccolta"],cs2.map(function(r){return[tn(a,r.t),th(a,r.t),r.tipo,num(r.qta,1),r.dr||"da registrare"]})):E)+'</div>';}
else{var pr=trs(function(r){return r.prod});h+='<div class="card"><div class="kpi" style="margin:0"><div><small>Regime dichiarato</small><b>'+esc(a.reg)+'</b></div><div><small>Superficie totale</small><b>'+num(sum(a.par,"ha"))+' ha</b></div></div><h3>Superficie per tipologia</h3>'+tb(["Tipologia","Ettari"],TT.map(function(t){return[t,num(sum(a.par.filter(function(p){return p.tipo===t}),"ha"))]}))+'<h3>Prodotti utilizzati, campagna '+y+'</h3>'+(pr.length?tb(["Data","Destinazione","Tipologia","Prodotto","Quantità","Avversità"],pr.map(function(r){return[r.data,tn(a,r.t),r.tipo,r.prod,num(r.qta)+" "+r.um,r.avv||"–"]})):E)+'<p class="note">Elenco di supporto per le pratiche: l’ammissibilità dei prodotti va verificata dall’agronomo secondo la normativa in vigore.</p></div>';}
return h;}

/* ---------- render ---------- */
function render(){var m=document.getElementById("app"),nv=document.getElementById("nv"),ok=S.role;
document.getElementById("sw").style.display=ok?"":"none";document.getElementById("rb").innerHTML=ok?'<span class="badge">'+(ok==="f"?"Agricoltore":"Agronomo")+'</span>':"";
if(!ok){nv.style.display="none";m.innerHTML='<div class="hero"><h2>Accedi ad AgroMY</h2><p class="empty">1. Scegli il tuo profilo</p><div class="chips" style="justify-content:center"><button class="chip'+(S.sel==="f"?" on":"")+'" data-role="f">Agricoltore</button><button class="chip'+(S.sel==="a"?" on":"")+'" data-role="a">Agronomo</button></div><p class="empty">2. Inserisci le tue credenziali</p><div class="card" style="text-align:left"><div class="grid" style="grid-template-columns:1fr">'+field("Email","lg_e","email",'value="'+esc(S.lge)+'" autocomplete="username"')+field("Password","lg_p","password",'autocomplete="current-password"')+'<p class="neg" id="lg_err" role="alert" style="margin:0"></p><button class="btn" id="lg_in">Accedi</button><button class="btn sec" id="lg_up">Crea account</button></div><p class="note">Gli account sono salvati solo su questo dispositivo: per usarli da più dispositivi serve un servizio online.</p></div></div>';return;}
if(ok==="f"){var a=A();if(!a&&myAz().length&&!S.nuova){S.cur=myAz()[0].id;a=A();}if(a&&a.camps.indexOf(S.cy)<0)S.cy=yrs(a)[0];
nv.style.display=a&&!S.nuova?"":"none";var T=[["az","Azienda"],["camp","Campagna"],["ric","Ricavi"],["rec","Recap"],["inv","Agronomo"]];
document.getElementById("tabs").innerHTML=T.map(function(t){return'<button data-t="'+t[0]+'" aria-selected="'+(S.v===t[0])+'">'+t[1]+'</button>'}).join("");
m.innerHTML={az:vAz,camp:vCamp,ric:vRic,rec:vRec,inv:vInv}[S.v]();}
else{nv.style.display="none";m.innerHTML=S.ag?vAD():vAL();}}

function hash(p,e){var t=e+"|"+p;if(!window.crypto||!crypto.subtle)return Promise.resolve("b:"+btoa(unescape(encodeURIComponent(t))));return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(d){return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")});}
function auth(reg){var em=f("lg_e").trim().toLowerCase(),pw=f("lg_p"),er=document.getElementById("lg_err");function bad(m){er.textContent=m;}
if(!S.sel)return bad("Scegli prima il profilo: agricoltore o agronomo.");if(!/\S+@\S+\.\S+/.test(em))return bad("Inserisci un’email valida.");if(pw.length<6)return bad("La password deve avere almeno 6 caratteri.");
hash(pw,em).then(function(h){var u=S.users.filter(function(x){return x.email===em})[0];
if(reg){if(u)return bad("Esiste già un account con questa email.");u={email:em,hash:h,role:S.sel,nome:""};S.users.push(u);}
else{if(!u||u.hash!==h)return bad("Email o password non corretti.");if(u.role!==S.sel)return bad("Questo account è registrato come "+(u.role==="f"?"agricoltore":"agronomo")+".");}
S.role=u.role;S.me={nome:u.nome,email:u.email};S.ag="";S.v="az";S.nuova=false;S.lge="";save();render();});}

document.getElementById("tabs").onclick=function(e){var t=e.target.getAttribute("data-t");if(t){S.v=t;S.nuova=false;save();render();}};

if(t.id==="sel_az"){if(t.value==="new")S.nuova=true;else{S.nuova=false;S.cur=t.value;}}
else if(t.id==="sel_y"||t.id==="sel_ay")S.cy=+t.value;
else if(ch){var z=ch.split(":");(z[0]==="par"?a.par:a.gru).filter(function(r){return r.id===z[1]})[0].tipo=t.value;}
else if(rc){var q=rc.split(":"),r=a.col.filter(function(x){return x.id===q[0]})[0];r[q[1]]=q[1]==="dr"?t.value:(+t.value||0);}
else return;save();render();});
app.addEventListener("click",function(e){var t=e.target,id=t.id,a=A(),d=t.getAttribute("data-del"),g=t.getAttribute("data-tg"),ad=t.getAttribute("data-add"),ro=t.getAttribute("data-role"),go=t.getAttribute("data-go"),av=t.getAttribute("data-av");
if(ro){S.sel=ro;S.lge=(document.getElementById("lg_e")||{}).value||"";}
else if(id==="lg_in"||id==="lg_up"){auth(id==="lg_up");return;}
else if(go){S.ag=go;S.av="par";}
else if(t.getAttribute("data-back")){S.ag="";}
else if(av){S.av=av;}
else if(d){if(S.role!=="f")return;var k=d.slice(0,d.indexOf(":")),i=d.slice(d.indexOf(":")+1);a[k]=a[k].filter(function(r){return r.id!==i});if(k==="par")a.gru.forEach(function(x){x.pids=x.pids.filter(function(j){return j!==i})});}
else if(g){var b=g.split(":"),gr=a.gru.filter(function(x){return x.id===b[0]})[0],ix=gr.pids.indexOf(b[1]);if(ix>-1)gr.pids.splice(ix,1);else gr.pids.push(b[1]);}
else if(ad){var kd=ad.slice(0,ad.indexOf(":")),tg=ad.slice(ad.indexOf(":")+1);function v(x){return f(kd+"-"+tg+"-"+x);}

else{if(!v("p").trim()&&v("t")!=="Aratura"&&v("t")!=="Irrigazione"){document.getElementById("tr-"+tg+"-p").focus();return;}a.tr.push({id:uid(),y:S.cy,t:tg,data:v("d")||today(),tipo:v("t"),prod:v("p").trim(),qta:+v("q")||0,um:v("u"),costo:+v("k")||0,ore:+v("o")||0,op:v("w"),cor:+v("c")||0,lt:+v("l")||0,pl:+v("f")||0,avv:v("a").trim()});}}
else if(id==="az_save"){var ids=["a_n","a_t","a_c","a_i"];for(var q=0;q<4;q++){if(!f(ids[q]).trim()){document.getElementById(ids[q]).focus();return;}}

if(!a||S.nuova){o.id=uid();o.owner=S.me.email;o.ope=[];o.agro="";o.par=[];o.gru=[];o.camps=[Y0];o.col=[];o.tr=[];S.list.push(o);S.cur=o.id;S.nuova=false;S.cy=Y0;}else for(var kk in o)a[kk]=o[kk];}
else if(id==="o_add"){if(!f("o_n").trim()||!f("o_c").trim()){document.getElementById("o_n").focus();return;}a.ope.push({id:uid(),nome:f("o_n").trim(),cg:f("o_c").trim()});}
else if(id==="q_add"){var b2=AG();if(!b2||!f("q_n").trim()){document.getElementById("q_n").focus();return;}b2.par.push({id:uid(),nome:f("q_n").trim(),mun:f("q_m"),fg:f("q_f"),mp:f("q_p"),ha:+f("q_h")||0,tipo:f("q_t"),loc:f("q_l").trim(),by:S.me.email});}
else if(id==="p_add"){if(!f("p_n").trim()){document.getElementById("p_n").focus();return;}a.par.push({id:uid(),nome:f("p_n").trim(),mun:f("p_m"),fg:f("p_f"),mp:f("p_p"),ha:+f("p_h")||0,tipo:f("p_t"),loc:f("p_l").trim()});}
else if(id==="g_add"){if(!f("g_n").trim()){document.getElementById("g_n").focus();return;}a.gru.push({id:uid(),nome:f("g_n").trim(),tipo:f("g_t"),pids:[]});}
else if(id==="y_add"){var yy=+f("y_n");if(yy>1999&&a.camps.indexOf(yy)<0)a.camps.push(yy);S.cy=yy;}
else if(id==="inv_add"){var ie=f("inv_e").trim().toLowerCase();if(!/\S+@\S+/.test(ie)){document.getElementById("inv_e").focus();return;}a.agro=ie;}
else if(id==="inv_del")a.agro="";
else if(id==="demo")demo();
else return;
save();render();});

render();
})();
